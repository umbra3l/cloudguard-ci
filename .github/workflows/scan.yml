name: CloudGuard Security Scan

on:
  push:
    branches:
      - main

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
  
      - name: Compile scanner
        run: g++ -std=c++17 main.cpp -o cloudguard

      - name: Run security scan
        run: ./cloudguard
